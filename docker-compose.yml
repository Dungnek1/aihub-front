services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aihub-frontend
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT_FE:-9050}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - NEXT_PUBLIC_NOTIFICATION_URL=${NEXT_PUBLIC_NOTIFICATION_URL}
    expose:
      - "9050"
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.aihub-frontend.rule=Host(`aihubvietnam.com`) || Host(`www.aihubvietnam.com`)
      - traefik.http.routers.aihub-frontend.entrypoints=websecure
      - traefik.http.routers.aihub-frontend.tls.certresolver=le
      - traefik.http.services.aihub-frontend.loadbalancer.server.port=9050
      - traefik.http.routers.aihub-frontend-http.rule=Host(`aihubvietnam.com`) || Host(`www.aihubvietnam.com`)
      - traefik.http.routers.aihub-frontend-http.entrypoints=web
      - traefik.http.routers.aihub-frontend-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https

networks:
  traefik-network:
    external: true
